[package]
name = "temps-otel-dash-plugin"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "OpenTelemetry dashboard plugin for Temps — ingests OTLP traces and visualises services, traces and spans"
repository = "https://gitea.verr-foo.com/temps/temps-proj-otel-dash"

[[bin]]
name = "temps-otel-dash-plugin"
path = "src/main.rs"

[dependencies]
# Temps plugin SDK — pinned to a released Temps tag. Bump deliberately; the
# channel protocol must match the host that spawns this binary.
temps-plugin-sdk = { git = "https://github.com/gotempsh/temps", tag = "v0.1.0-beta.57" }

# HTTP and async
axum = "0.8"
tokio = { version = "1.47", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Storage — plugin-owned SQLite in `data_dir`, tuned through sqlx connect options
# (WAL, NORMAL sync, busy timeout) and driven through sea-orm.
sea-orm = { version = "1.1.14", default-features = false, features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }

# Errors and logging
thiserror = "2"
tracing = "0.1"

# OpenAPI — version must match the SDK's `utoipa` so `openapi_schema()` type-checks.
utoipa = { version = "6.0.0", features = ["axum_extras"] }

# Utilities
chrono = { version = "0.4.38", features = ["serde"] }
uuid = { version = "1.10", features = ["v4"] }
subtle = "2.6"
include_dir = "0.7"
mime_guess = "2.0"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
# Optimise dependencies (sqlx, serde, sea-orm) even in debug builds so local
# ingest benchmarks are representative without a full release build.
opt-level = 2
